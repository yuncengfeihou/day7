<!-- 文件: public/extensions/third-party/day7/settings_display.html -->
<div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>每日聊天统计3.0</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content" style="padding: 10px;">
        <p>记录您每天与不同角色/群组的互动情况。</p>

        <!-- *** 新增日期选择器 *** -->
        <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
            <label for="day1-date-selector">查看日期:</label>
            <input type="date" id="day1-date-selector" class="text_pole">
            <button id="day1-goto-today-button" class="menu_button" title="跳转到今天"><i class="fa-solid fa-calendar-day"></i> 今天</button>
            <button id="day1-refresh-button" class="menu_button" title="刷新选定日期的统计"><i class="fa-solid fa-arrows-rotate"></i> 刷新</button>
        </div>
        <!-- *** 修改结束 *** -->

        <div id="day1-stats-container" style="margin-top: 5px; max-height: 400px; overflow-y: auto;">
            <table id="day1-stats-table" class="stats-table">
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>用户(Tokens)</th>
                        <th>AI  (Tokens)</th>
                        <th>本日 Tokens</th> 
                        <th>本日 AI耗时</th>  
                        <th>本日聊天时长</th>     
                        <th>总交互时长</th>
                        <th>选定日总在线时长</th> 
                    </tr>
                </thead>
                <tbody id="day1-stats-table-body">
                    <tr><td colspan="8"><i>加载中...</i></td></tr>
                </tbody>
            </table>
        </div>
        <small style="margin-top: 5px; display: block; color: var(--text-color-secondary);"><i>注：Prompt Tokens 指选定日期内每次发送给 AI 的完整上下文的总 Token 数累加值。AI 总耗时指 AI 生成回复所用的时间总和。</i></small>
    </div>
</div>
